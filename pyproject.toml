[project]
name = "sous-kit"
version = "0.0.1"
description = "Sous Kit - FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.1",
    "cryptography>=49.0.0",
    "email-validator>=2.3.0",
    "fastapi[standard]==0.115.6",
    "google-auth==2.38.0",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings==2.7.0",
    "pyjwt==2.10.1",
    "recipe-scrapers>=15.0.0",
    "requests==2.32.3",
    "sqlalchemy==2.0.36",
    "sqlmodel==0.0.22",
    "webauthn>=3.0.1",
]

[dependency-groups]
dev = [
    "black==24.10.0",
    "flake8==7.1.1",
    "isort==5.13.2",
]

[tool.uv]
# This is a runnable application, not an installable package.
package = false

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyx?$'
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
^/foo.py  # exclude a file named foo.py in the root of the project
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
